name: entrelinhas_app
description: EntreLinhas - frontend Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  connectivity_plus: ^6.0.3
  
  # Ícones iOS
  cupertino_icons: ^1.0.8

  # Estado (gerenciamento global)
  provider: ^6.0.5

  # HTTP e autenticação segura
  http: ^1.1.0
  flutter_secure_storage: ^8.0.0

  # Armazenamento local (offline sync - RNF06)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.12

  # Scanner e upload de imagem (RF06, RF11)
  barcode_scan2: ^4.2.0
  image_picker: ^0.8.7+4

  # Fontes e design
  google_fonts: ^4.0.3

  # Internacionalização (datas, formatos)
  intl: ^0.18.0

  # Deep Links (para abrir o app via link do e-mail)
  app_links: ^6.1.3
  shimmer: ^3.0.0
  mime: ^2.0.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Geração de código para Hive
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-VariableFont_wdth,wght.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Italic-VariableFont_wdth,wght.ttf
          style: italic
